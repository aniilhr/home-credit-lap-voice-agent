<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAP Qualification Console</title>
    <meta name="description" content="Live test console for the Home Credit Loan Against Property qualification voice agent." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230d1424'/%3E%3Cpath d='M5 4v8h6' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('lap-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./css/console.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <a class="skip-link glass" href="#main">Skip to content</a>

    <header class="header glass">
      <a class="brand" href="#/overview" aria-label="LAP Console home">
        <span class="brand__mark" aria-hidden="true">L</span>
        <span class="brand__name">LAP Console <span class="brand__sub">· Home Credit</span></span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/simulator" data-route="simulator">Live call</a>
        <a href="#/scenarios" data-route="scenarios">Scenarios</a>
        <a href="#/rules" data-route="rules">Rules</a>
        <a href="#/flow" data-route="flow">Call flow</a>
        <a href="#/prompt" data-route="prompt">Prompt</a>
      </nav>
      <div class="header__tools">
        <span class="status-chip" id="llm-status" title="Live AI status">
          <span class="dot"></span><span class="status-chip__label">Checking…</span>
        </span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle colour theme"></button>
      </div>
    </header>

    <main id="main" class="content" tabindex="-1"></main>

    <noscript><div class="noscript glass">This console needs JavaScript. Run <code>npm start</code> and open the printed address.</div></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
